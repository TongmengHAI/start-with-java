spring.application.name=generate_audit_log_db_script
server.port=8081
spring.jackson.time-zone=Asia/Phnom_Penh

spring.datasource.url=jdbc:mysql://localhost:3306/test_audit_log_dynamic
spring.datasource.username=root
spring.datasource.password=


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto= update
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Phnom_Penh


spring.jpa.show-sql=true