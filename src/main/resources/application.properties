spring.application.name=ratelimit
# Server
server.port=8082

# Redis (Windows local)
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
# spring.data.redis.password=
spring.data.redis.timeout=2s

# Rate limiter configuration (your custom props)
ratelimit.enabled=true
ratelimit.limit=100
ratelimit.window-seconds=60
ratelimit.bucket-name=api
# ratelimit.header-name=X-API-Key   # uncomment to key by API key header

